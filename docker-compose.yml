services:
  db:
    image: postgres:16
    container_name: mzm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mzm_db
      POSTGRES_USER: mzm_user
      POSTGRES_PASSWORD: mzm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mzm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: mzm_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: mzm_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    # Vite odczytuje publiczny Client ID Google ze zmiennej rozpoczynającej się od VITE_.
    env_file:
      - .env.example
    depends_on:
      - backend

volumes:
  postgres_data:

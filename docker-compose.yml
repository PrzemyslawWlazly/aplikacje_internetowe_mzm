services:
  db:
    image: postgres:16
    container_name: mzm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mzm_db
      POSTGRES_USER: mzm_user
      POSTGRES_PASSWORD: mzm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mzm_user -d mzm_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: mzm_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: mzm_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: mzm_db
      POSTGRES_USER: mzm_user
      POSTGRES_PASSWORD: mzm_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
    container_name: mzm_worker
    restart: unless-stopped
    entrypoint: []
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: mzm_db
      POSTGRES_USER: mzm_user
      POSTGRES_PASSWORD: mzm_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    container_name: mzm_scheduler
    restart: unless-stopped
    entrypoint: []
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: mzm_db
      POSTGRES_USER: mzm_user
      POSTGRES_PASSWORD: mzm_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: mzm_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    # Vite odczytuje publiczny Client ID Google ze zmiennej rozpoczynającej się od VITE_.
    env_file:
      - path: frontend/.env.local
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
